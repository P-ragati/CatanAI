<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catan AI — Colonist-style UI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<div id="fxLayer" style="position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:5000;"></div>
<body>
  <header class="topbar">
    <div class="brand">Catan AI Prototype</div>
    <div class="turn-indicator" id="turnIndicator">Turn: - | Current: -</div>
    <div class="sound-control">
    🔊 <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.7">
    </div>
  </header>

  <main class="layout">
    <!-- Left: Game Log -->
    <aside class="panel left">
      <div class="panel-title">Game Log</div>
      <div id="gamelog" class="log">No events yet.</div>
    </aside>

    <!-- Middle: Board -->
    <section class="board-wrap">
      <div class="controls-top">
        <button id="newGameBtn" class="btn primary">New Game</button>
        <button id="rollBtn" class="btn accent">Roll Dice</button>
        <div id="diceDisplay" class="dice">🎲</div>
      </div>

      <div id="board" class="board" aria-label="Catan board">
        <div id="tilesLayer" class="layer tiles-layer"></div>
        <div id="roadsLayer" class="layer roads-layer"></div>
        <div id="nodesLayer" class="layer nodes-layer"></div>
      </div>

      <div class="cards-row panel">
        <div id="resourceCards" class="resource-cards"></div>

        <div id="devPanel" class="dev-panel">
          <div class="dev-header">
            <div>Dev Cards</div>
            <div class="dev-deck" id="devDeckInfo">Deck: -</div>
          </div>
          <div id="devHand" class="dev-hand"></div>
          <div class="dev-actions">
            <button id="buyDevBtn" class="btn">Buy Dev Card</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Right: Player -->
    <aside class="panel right">
      <div class="panel-title">Players</div>
      <div id="players" class="players"></div>

      <div class="panel-title">Actions</div>
      <div class="action-buttons">
        <button id="buildSettlementBtn" class="btn">🏠 Build Settlement</button>
        <button id="buildRoadBtn" class="btn">🛣️ Build Road</button>
      </div>
    </aside>
  </main>

  <footer class="footer">
    Small prototype — UI inspired by colonist.io
  </footer>

  <!-- Robber victim drawer -->
  <div id="robberDrawer" class="robber-drawer" aria-hidden="true">
    <div class="drawer-header">Choose a player to steal from</div>
    <div id="robberVictimList" class="drawer-list"></div>
    <button id="robberCancelBtn" class="drawer-cancel">Cancel</button>
  </div>

  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
